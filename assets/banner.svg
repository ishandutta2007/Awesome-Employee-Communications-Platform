<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes floatParticle1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
        50% { transform: translate(25px, -30px) scale(1.15); opacity: 0.8; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
      }
      @keyframes floatParticle2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        50% { transform: translate(-35px, 20px) scale(1.2); opacity: 0.7; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.6; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }

      .animated-bg-ring {
        transform-origin: 950px 200px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .particle-1 { animation: floatParticle1 8s ease-in-out infinite; }
      .particle-2 { animation: floatParticle2 10s ease-in-out infinite; }
      .beam-line {
        stroke-dasharray: 200 400;
        animation: beamMove 12s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Background Geometric Elements (Behind Text) -->
  <g class="animated-bg-ring" opacity="0.4">
    <circle cx="950" cy="200" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="2" />
    <circle cx="950" cy="200" r="120" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.5" />
    <circle cx="950" cy="200" r="60" fill="url(#glowGrad)" opacity="0.3" filter="url(#glow)" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="particle-1" cx="150" cy="80" r="60" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle class="particle-2" cx="1050" cy="320" r="80" fill="#9333ea" opacity="0.2" filter="url(#glow)" />
  <circle class="particle-1" cx="600" cy="350" r="45" fill="#4f46e5" opacity="0.2" filter="url(#glow)" />

  <!-- Animated Connection Beams -->
  <path class="beam-line" d="M 50,320 Q 300,380 600,300 T 1150,100" fill="none" stroke="url(#textGrad)" stroke-width="2" opacity="0.3" />
  <path class="beam-line" d="M 100,50 Q 500,100 900,50 T 1180,250" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />

  <!-- Decorative Glassmorphism Background Card for Contrast -->
  <rect x="50" y="45" width="1100" height="310" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- FOREGROUND CONTENT: Badge Pill -->
  <g filter="url(#shadow)">
    <rect x="85" y="80" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="105" y="103" fill="#38bdf8" font-size="13" class="title-text" letter-spacing="1.5">🚀 AWESOME CURATED LIST</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <g filter="url(#shadow)">
    <text x="85" y="170" fill="#ffffff" font-size="44" class="title-text" letter-spacing="-0.5">
      Awesome Employee
    </text>
    <text x="85" y="225" fill="url(#textGrad)" font-size="44" class="title-text" letter-spacing="-0.5">
      Communications Platform
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <g filter="url(#shadow)">
    <text x="85" y="275" fill="#94a3b8" font-size="17" class="subtitle-text">
      Top SaaS Solutions &amp; Open-Source Projects for Digital Workplace, Intranet &amp; Frontline Engagement
    </text>
    <text x="85" y="302" fill="#64748b" font-size="14" class="subtitle-text">
      Updated for Enterprise Comms Teams, HR Leaders, IT Architects &amp; Workplace Strategists
    </text>
  </g>

  <!-- Right Side Visual Icon Graph (Foreground Overlay) -->
  <g transform="translate(850, 100)" filter="url(#shadow)">
    <!-- Node 1: Frontline -->
    <rect x="0" y="20" width="160" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="20" y="50" fill="#f8fafc" font-size="13" class="title-text">📱 Frontline Mobile</text>

    <!-- Node 2: Intranet -->
    <rect x="80" y="90" width="160" height="50" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />
    <text x="100" y="120" fill="#f8fafc" font-size="13" class="title-text">🌐 Social Intranet</text>

    <!-- Node 3: Analytics -->
    <rect x="-20" y="160" width="170" height="50" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="190" fill="#f8fafc" font-size="13" class="title-text">📊 Comms Analytics</text>

    <!-- Connecting lines -->
    <line x1="80" y1="70" x2="130" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="120" y1="140" x2="60" y2="160" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>
</svg>
